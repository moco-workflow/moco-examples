# `mcp.call_tool`: invoke a tool on an MCP server (streamable-http transport).
#
#   endpoint, tool_name, arguments, headers (e.g. Authorization)
#   relay_topic / relay_event_type   where the tool's PROGRESS notifications go:
#                   each one becomes an event with
#                   event["data"] = {progress, total, message}
#
# The activity returns when the tool does; its output is
# {stopped, result: {content: [...], structuredContent, isError}}. So there are
# two ways to call it, both shown here:
#
#   1. plain call -- block until the result, like any activity
#   2. streaming  -- async_mode: true; progress arrives as relayed events while
#                    the workflow keeps going, and the final result arrives as
#                    the async-completion event whose event_type is the token
#                    the activity returned (the transition trigger below uses
#                    '{{ call_token }}' for exactly that)
#
# SELF-CONTAINED BY DEFAULT: with use_local_server: true the spec starts a tiny
# FastMCP server (the `mcp` package moco-core already depends on) via shell.run,
# with two tools: add(a, b) and count_to(n), which reports progress once per
# step. The server exits shortly after count_to finishes. To call a real server
# instead, override endpoint / tool names / arguments / headers, e.g.
#
#   moco run mcp-call-tool.yaml -i '{"use_local_server": false,
#     "endpoint": "https://mcp.example.com/mcp", "headers": {"Authorization": "Bearer ..."}}'
#
# NEEDS: python on the worker PATH with `mcp` (default mode), or network access
# to `endpoint`. The MCP client does not use MOCO_HTTP_PROXY.
#
#   moco run mcp-call-tool.yaml
#   moco run mcp-call-tool.yaml -i '{"steps": 5}'

header:
  schema_version: 2.0.0
  workflow_name: act-mcp-call-tool
  tags: [act-demo, mcp]

context:
  progress_events: []
  final_result:
  timed_out: false
  server_script#literal: |
    python - <<'PY'
    import asyncio, os, threading
    from mcp.server.fastmcp import Context, FastMCP
    server = FastMCP("act-demo", host="127.0.0.1", port=int(os.environ["MCP_PORT"]))
    @server.tool()
    def add(a: int, b: int) -> int:
        """Add two integers."""
        return a + b
    @server.tool()
    async def count_to(n: int, ctx: Context) -> str:
        """Count to n, reporting progress at every step."""
        for i in range(1, n + 1):
            await asyncio.sleep(0.5)
            await ctx.report_progress(i, n, f"step {i} of {n}")
        threading.Timer(3, os._exit, [0]).start()    # stop the demo server soon after
        return f"counted to {n}"
    threading.Timer(90, os._exit, [0]).start()        # hard stop if never called
    server.run(transport="streamable-http")
    PY
  # Polls until the server's port accepts connections (fails after ~30s).
  wait_script#literal: |
    python - <<'PY'
    import os, socket, sys, time
    port = int(os.environ["PORT"])
    for _ in range(60):
        try:
            socket.create_connection(("127.0.0.1", port), 1).close()
            sys.exit(0)
        except OSError:
            time.sleep(0.5)
    sys.exit(f"port {port} never opened")
    PY

input:
  use_local_server: true
  port: 18767
  endpoint:  # default: http://127.0.0.1:<port>/mcp
  headers:
  steps: 3
  listen_timeout_sec: 30
output: '{{ report }}'

main:
  tasks:
    - task_name: ids
      set:
        - self_id: '{{ __sys_info__.get("workflow_id") or __sys_info__.get("trace_id") }}'
        - mcp_endpoint#: '{{ endpoint or "http://127.0.0.1:" + str(port) + "/mcp" }}'

    - task_name: start-local-server
      skip_if: '{{ not use_local_server }}'
      tasks:
        - task_name: run-server
          activity:
            type: shell.run
            input:
              # prefixed, not `env`: env would replace PATH too
              command: '{{ "MCP_PORT=" + str(int(port)) + " " + server_script }}'
              timeout: 100
            options:
              async_mode: true
        # A regular activity (not local like builtin.delay), so the async
        # server activity above is scheduled before this runs.
        - task_name: wait-for-server
          activity:
            type: shell.run
            input:
              command: '{{ "PORT=" + str(int(port)) + " " + wait_script }}'
              check: true
              timeout: 40

    # --- 1. plain call: block until the tool returns ---------------------------
    - task_name: call-add
      activity:
        type: mcp.call_tool
        input:
          endpoint: '{{ mcp_endpoint }}'
          headers: '{{ headers }}'
          tool_name: add
          arguments: {a: 2, b: 40}
        options:
          # The activity notices the tool has returned on its next heartbeat
          # tick (default ~20 s); a short interval makes plain calls snappy.
          retry_policy:
            timeout_sec: 60
            max_attempts: 1
            heartbeat_interval_sec: 1
      output:
        set:
          - add_result#: '{{ _["result"] }}'

    # A connection or protocol error does NOT fail the activity: the provider
    # logs it on the worker and returns result: null. Check for it.
    - task_name: check-add
      raise:
        if: '{{ add_result is None }}'
        type: terminate
        message: 'mcp.call_tool got no result from {{ mcp_endpoint }} (see worker log)'

    # --- 2. streaming call: progress events + async completion ----------------
    - task_name: stream-progress
      state_machine:
        initial_state: listen
        event_source_topic: act_mcp_relay
        states:
          - name: listen
            timeout_sec: '{{ listen_timeout_sec }}'
            on_enter:
              task_name: call-count-to
              activity:
                type: mcp.call_tool
                input:
                  endpoint: '{{ mcp_endpoint }}'
                  headers: '{{ headers }}'
                  tool_name: count_to
                  arguments:
                    n: '{{ steps }}'
                  relay_topic: act_mcp_relay
                  relay_event_type: mcp_progress
                  target_workflow_id: '{{ self_id }}'
                options:
                  retry_policy:
                    timeout_sec: 120
                    max_attempts: 1
                    heartbeat_interval_sec: 1
                  async_mode: true
                  async_event_topic: act_mcp_relay  # completion event lands here too
              output:
                as: call_token

          - name: done
            is_terminal: true

        transitions:
          - from_state: listen
            trigger:
              event_type: mcp_progress
              action:
                set:
                  - _t: '{{ progress_events.append(event["data"]) }}'
                  - progress#: '{{ event["data"]["message"] }}'

          # the async completion event: event_type is the token itself
          - from_state: listen
            to_state: done
            trigger:
              event_type: '{{ call_token }}'
              action:
                set:
                  - final_result#: '{{ event["data"] }}'
                  - call_status: '{{ event["metadata"]["status"] }}'

          - from_state: listen
            to_state: done
            trigger:
              event_type: sys.timer
              action:
                set:
                  - timed_out#: true

    - task_name: build-report
      set:
        - report:
            endpoint: '{{ mcp_endpoint }}'
            add_result: '{{ add_result }}'
            progress_events: '{{ progress_events }}'
            final_result: '{{ final_result }}'
            timed_out: '{{ timed_out }}'
