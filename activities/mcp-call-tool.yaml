# `mcp.call_tool`: invoke a tool on an MCP server (streamable-http transport).
#
#   endpoint, tool_name, arguments, headers, encrypted_auth_token (the output of
#                   builtin.secret.get; sent as Authorization: Bearer, never plaintext)
#   relay_topic / relay_event_type   where the tool's PROGRESS notifications go:
#                   each one becomes an event with
#                   event["data"] = {progress, total, message}
#
# The activity returns when the tool does; its output is
# {stopped, result: {content: [...], structuredContent, isError}}. So there are
# two ways to call it, both shown here:
#
#   1. plain call -- block until the result, like any activity
#   2. streaming  -- async_mode: true; progress arrives as relayed events while
#                    the workflow keeps going, and the final result arrives as
#                    the async-completion event whose event_type is the token
#                    the activity returned (the transition trigger below uses
#                    '{{ call_token }}' for exactly that)
#
# THE SERVER IS MOCO ITSELF: moco-server serves MCP at /mcp/, and its
# execute_workflow tool runs a wfspec and returns its output as JSON text,
# {"success": ..., "result": ...}. Run with debug_mode, it also reports every
# debug event of that run (workflow_start, a data_log per `#`-suffixed
# variable, workflow_end) as an MCP progress notification whose `message` is
# the event as JSON -- which is what the streaming half listens to. The child
# specs below are passed inline as wfspec_info.content. Keep the trailing slash
# on the endpoint: /mcp answers with a redirect.
#
# NEEDS: a moco API key stored as a secret, because moco's MCP endpoint
# requires a bearer token. Once:
#
#   moco secret upload MOCO_MCP_APIKEY \
#     "$(moco apikey create mcp-call-tool-demo --expires-in 7d)"
#
# (piped, `apikey create` prints only the key, so it never hits your terminal
# or shell history). builtin.secret.get returns the key still encrypted and
# mcp.call_tool decrypts it internally, so the plaintext never enters workflow
# context. The stored key acts as you on every moco tool, hence the short
# expiry; `moco secret delete MOCO_MCP_APIKEY` when done. Progress also needs
# moco-server to have its debug event bus (MOCO_RMQ_CONNECTION_URL); without it
# the call still returns, with no progress events.
#
#   moco run mcp-call-tool.yaml
#   moco run mcp-call-tool.yaml -i '{"steps": 5}'

header:
  schema_version: 2.0.0
  workflow_name: act-mcp-call-tool
  tags: [act-demo, mcp]

context:
  mcp_token:
  progress_events: []
  final_result:
  timed_out: false
  # Child spec for the plain call: adds two numbers.
  add_spec#literal: |
    header: {schema_version: 2.0.0, workflow_name: act-mcp-call-tool-add}
    input: {a: 0, b: 0}
    output: '{{ a + b }}'
    main:
      tasks:
        - task_name: noop
          set:
            - done: true
  # Child spec for the streaming call: counts to n, one data_log per step.
  count_spec#literal: |
    header: {schema_version: 2.0.0, workflow_name: act-mcp-call-tool-count}
    input: {n: 3}
    output: '{{ "counted to " + str(n) }}'
    main:
      tasks:
        - task_name: count
          loop:
            in: '{{ list(range(1, n + 1)) }}'
            foreach: i
            do:
              task_name: tick
              tasks:
                - task_name: pause
                  wait_for:
                    timeout_sec: 0.5
                - task_name: report
                  set:
                    - step#: '{{ i }}'

input:
  endpoint: http://localhost:8080/mcp/
  secret_name: MOCO_MCP_APIKEY
  headers:
  steps: 3
  listen_timeout_sec: 60
output: '{{ report }}'

main:
  tasks:
    - task_name: ids
      set:
        - self_id: '{{ __sys_info__.get("workflow_id") or __sys_info__.get("trace_id") }}'

    # Fetched right before use: the encrypted copy expires (60 s by default).
    - task_name: get-token
      skip_if: '{{ not secret_name }}'
      activity:
        type: builtin.secret.get
        input:
          secret_name: '{{ secret_name }}'
      output:
        as: mcp_token

    # --- 1. plain call: block until the tool returns ---------------------------
    - task_name: call-add
      activity:
        type: mcp.call_tool
        input:
          endpoint: '{{ endpoint }}'
          headers: '{{ headers }}'
          encrypted_auth_token: '{{ mcp_token }}'
          tool_name: execute_workflow
          arguments:
            wfspec_info:
              content: '{{ add_spec }}'
            input_data: {a: 2, b: 40}
        options:
          # The activity notices the tool has returned on its next heartbeat
          # tick (default ~20 s); a short interval makes plain calls snappy.
          retry_policy:
            timeout_sec: 60
            max_attempts: 1
            heartbeat_interval_sec: 1
      output:
        set:
          - add_result#: '{{ _["result"] }}'

    # A connection or protocol error does NOT fail the activity: the provider
    # logs it on the worker and returns result: null. And execute_workflow
    # reports a failed child run as success: false, not as an MCP error.
    # Check for both.
    - task_name: check-add
      tasks:
        - task_name: no-result
          raise:
            if: '{{ add_result is None }}'
            type: terminate
            message: 'mcp.call_tool got no result from {{ endpoint }} (see worker log)'
        - task_name: parse
          set:
            - add_reply#: '{{ json.loads(add_result["content"][0]["text"]) }}'
        - task_name: child-failed
          raise:
            if: '{{ not add_reply["success"] }}'
            type: terminate
            message: 'execute_workflow failed: {{ add_reply.get("error") }}'

    # --- 2. streaming call: progress events + async completion ----------------
    - task_name: stream-progress
      state_machine:
        initial_state: listen
        event_source_topic: act_mcp_relay
        states:
          - name: listen
            timeout_sec: '{{ listen_timeout_sec }}'
            on_enter:
              task_name: call-count
              activity:
                type: mcp.call_tool
                input:
                  endpoint: '{{ endpoint }}'
                  headers: '{{ headers }}'
                  encrypted_auth_token: '{{ mcp_token }}'
                  tool_name: execute_workflow
                  arguments:
                    wfspec_info:
                      content: '{{ count_spec }}'
                    input_data:
                      n: '{{ steps }}'
                    options:
                      debug_mode: true
                  relay_topic: act_mcp_relay
                  relay_event_type: mcp_progress
                  target_workflow_id: '{{ self_id }}'
                options:
                  retry_policy:
                    timeout_sec: 120
                    max_attempts: 1
                    heartbeat_interval_sec: 1
                  async_mode: true
                  async_event_topic: act_mcp_relay  # completion event lands here too
              output:
                as: call_token

          - name: done
            is_terminal: true

        transitions:
          # message is the child run's debug event as JSON
          - from_state: listen
            trigger:
              event_type: mcp_progress
              action:
                set:
                  - _debug: '{{ json.loads(event["data"]["message"]) }}'
                  - _t: '{{ progress_events.append({"progress": event["data"]["progress"], "event_type": _debug["event_type"], "event_data": _debug.get("event_data")}) }}'
                  - progress#: '{{ _debug["event_type"] }}'

          # the async completion event: event_type is the token itself
          - from_state: listen
            to_state: done
            trigger:
              event_type: '{{ call_token }}'
              action:
                set:
                  - final_result#: '{{ event["data"] }}'
                  - call_status: '{{ event["metadata"]["status"] }}'

          - from_state: listen
            to_state: done
            trigger:
              event_type: sys.timer
              action:
                set:
                  - timed_out#: true

    - task_name: build-report
      set:
        - report:
            endpoint: '{{ endpoint }}'
            add_result: '{{ add_reply["result"] }}'
            progress_events: '{{ progress_events }}'
            final_result: '{{ json.loads(final_result["result"]["content"][0]["text"]) if final_result and final_result.get("result") else final_result }}'
            timed_out: '{{ timed_out }}'
