# The `playwright.*` activities: drive a headless browser, step by step.
#
#   browser.create / get_info / close   a session lives on the WORKER that
#                     created it; every later call passes its session_id.
#                     Always close it -- sessions count against a per-user quota.
#   page.*            goto, back, forward, reload, title, url, content,
#                     evaluate (JS), screenshot (base64), wait_for_selector,
#                     wait_for_url, wait_for_timeout
#   element.*         fill, type, clear, click, select, get_text,
#                     get_attribute, is_visible, is_enabled, query_selector,
#                     query_selector_all
#   selector_type     css (default), xpath, text or role at runtime -- but the
#                     shipped wfspec schema currently only accepts css / xpath
#                     here (it collides with selenium's selector enum), and
#                     likewise rejects screenshot `format`; so this spec sticks
#                     to css / xpath and the default png
#
# OFFLINE BY DEFAULT: the pages are data: URLs built inside the workflow, so
# nothing leaves the machine. Point `external_url` at a real site to include
# one live navigation (it goes through MOCO_HTTP_PROXY when set).
#
# NEEDS: Playwright browsers installed on the worker host
# (`python -m playwright install chromium`), and a single worker -- or sticky
# routing -- because the session is held in that worker's memory.
#
#   moco run playwright.yaml
#   moco run playwright.yaml -i '{"external_url": "https://example.com"}'

header:
  schema_version: 2.0.0
  workflow_name: act-playwright
  tags: [act-demo, browser, requires-playwright-browsers]

context:
  form_html: >-
    <html><head><title>Act Demo Form</title></head><body> <h1 id="heading">Order form</h1> <input id="name" placeholder="your name"> <select id="color"><option value="red">Red</option><option value="blue">Blue</option></select> <button id="go" onclick="document.getElementById('out').textContent =
      'Hello ' + document.getElementById('name').value + ' (' + document.getElementById('color').value + ')'">Go</button>
    <button id="locked" disabled>Disabled</button> <ul><li>one</li><li>two</li><li>three</li></ul> <p id="out"></p> <a id="docs" href="https://example.com/docs">docs</a> </body></html>
  second_html: <html><head><title>Second Page</title></head><body><p>second</p></body></html>

input:
  browser_type: chromium
  your_name: Ada
  external_url:

output: '{{ report }}'

main:
  tasks:
    - task_name: build-pages
      set:
        - form_url: '{{ "data:text/html;base64," + base64.b64encode(form_html.encode()).decode() }}'
        - second_url: '{{ "data:text/html;base64," + base64.b64encode(second_html.encode()).decode() }}'

    - task_name: create
      activity:
        type: playwright.browser.create
        input:
          browser_type: '{{ browser_type }}'
          options: {headless: true, viewport_width: 1280, viewport_height: 800}
      output:
        set:
          - sid: '{{ _["session_id"] }}'

    - task_name: info
      activity:
        type: playwright.browser.get_info
        input: {session_id: '{{ sid }}'}
      output:
        as: browser_info

    # --- navigation --------------------------------------------------------------
    - task_name: goto-form
      activity:
        type: playwright.page.goto
        input: {session_id: '{{ sid }}', url: '{{ form_url }}', wait_until: load}
    - task_name: title
      activity:
        type: playwright.page.title
        input: {session_id: '{{ sid }}'}
      output:
        set:
          - title#: '{{ _["title"] }}'
    - task_name: wait-heading
      activity:
        type: playwright.page.wait_for_selector
        input: {session_id: '{{ sid }}', selector: '#heading', state: visible, timeout: 5000}

    # --- elements ------------------------------------------------------------------
    - task_name: fill-name
      activity:
        type: playwright.element.fill
        input: {session_id: '{{ sid }}', selector: '#name', text: placeholder}
    - task_name: clear-name
      activity:
        type: playwright.element.clear
        input: {session_id: '{{ sid }}', selector: '#name'}
    - task_name: type-name
      activity:
        type: playwright.element.type
        input: {session_id: '{{ sid }}', selector: '#name', text: '{{ your_name }}', delay: 20}
    - task_name: pick-color
      activity:
        type: playwright.element.select
        input: {session_id: '{{ sid }}', selector: '#color', value: blue}
    - task_name: click-go
      activity:
        type: playwright.element.click
        input: {session_id: '{{ sid }}', selector: '#go'}
    - task_name: read-output
      activity:
        type: playwright.element.get_text
        input: {session_id: '{{ sid }}', selector: '#out'}
      output:
        set:
          - greeting#: '{{ _["text"] }}'
    - task_name: link-href
      activity:
        type: playwright.element.get_attribute
        input: {session_id: '{{ sid }}', selector: '//a[@id="docs"]', selector_type: xpath, attribute: href}
      output:
        set:
          - href: '{{ _["value"] }}'
    - task_name: out-visible
      activity:
        type: playwright.element.is_visible
        input: {session_id: '{{ sid }}', selector: '#out'}
      output:
        set:
          - out_visible: '{{ _["visible"] }}'
    - task_name: locked-enabled
      activity:
        type: playwright.element.is_enabled
        input: {session_id: '{{ sid }}', selector: '#locked'}
      output:
        set:
          - off_enabled: '{{ _["enabled"] }}'
    - task_name: has-missing
      activity:
        type: playwright.element.query_selector
        input: {session_id: '{{ sid }}', selector: '#does-not-exist', timeout: 1000}
      output:
        set:
          - missing_found: '{{ _["found"] }}'
    - task_name: count-items
      activity:
        type: playwright.element.query_selector_all
        input: {session_id: '{{ sid }}', selector: 'li'}
      output:
        set:
          - li_count: '{{ _["count"] }}'

    # --- page-level reads -------------------------------------------------------------
    - task_name: evaluate-js
      activity:
        type: playwright.page.evaluate
        input:
          session_id: '{{ sid }}'
          script: '() => Array.from(document.querySelectorAll("li")).map(li => li.textContent)'
      output:
        set:
          - js_result#: '{{ _["result"] }}'
    - task_name: content
      activity:
        type: playwright.page.content
        input: {session_id: '{{ sid }}'}
      output:
        set:
          - html_length: '{{ len(_["content"]) }}'
    - task_name: screenshot
      activity:
        type: playwright.page.screenshot
        input: {session_id: '{{ sid }}', full_page: true}  # png by default
      output:
        set:
          - screenshot_b64_chars: '{{ len(_["screenshot"]) }}'

    # --- history ----------------------------------------------------------------------
    - task_name: goto-second
      activity:
        type: playwright.page.goto
        input: {session_id: '{{ sid }}', url: '{{ second_url }}'}
    - task_name: wait-second-url
      activity:
        type: playwright.page.wait_for_url
        input: {session_id: '{{ sid }}', url: '{{ second_url }}', timeout: 5000}
    - task_name: back
      activity:
        type: playwright.page.back
        input: {session_id: '{{ sid }}'}
    - task_name: forward
      activity:
        type: playwright.page.forward
        input: {session_id: '{{ sid }}'}
    - task_name: reload
      activity:
        type: playwright.page.reload
        input: {session_id: '{{ sid }}'}
    - task_name: pause
      activity:
        type: playwright.page.wait_for_timeout
        input: {session_id: '{{ sid }}', timeout: 200}
    - task_name: current-url
      activity:
        type: playwright.page.url
        input: {session_id: '{{ sid }}'}
      output:
        set:
          - ended_on_second: '{{ _["url"] == second_url }}'

    # --- optional live site -------------------------------------------------------------
    - task_name: live-site
      skip_if: '{{ external_url is None }}'
      tasks:
        - task_name: goto-external
          activity:
            type: playwright.page.goto
            input: {session_id: '{{ sid }}', url: '{{ external_url }}'}
        - task_name: external-title
          activity:
            type: playwright.page.title
            input: {session_id: '{{ sid }}'}
          output:
            set:
              - external_title#: '{{ _["title"] }}'

    - task_name: close
      activity:
        type: playwright.browser.close
        input: {session_id: '{{ sid }}'}

    - task_name: build-report
      set:
        - report:
            browser: '{{ browser_info }}'
            title: '{{ title }}'
            greeting: '{{ greeting }}'
            href: '{{ href }}'
            out_visible: '{{ out_visible }}'
            disabled_button_enabled: '{{ off_enabled }}'
            missing_found: '{{ missing_found }}'
            li_count: '{{ li_count }}'
            js_result: '{{ js_result }}'
            html_length: '{{ html_length }}'
            screenshot_b64_chars: '{{ screenshot_b64_chars }}'
            ended_on_second: '{{ ended_on_second }}'
            external_title: '{{ external_title if external_url is not None else None }}'
