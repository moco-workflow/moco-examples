# `kafka.publish` + `kafka.consume`, round-tripped inside one workflow.
#
#   kafka.publish  messages is a list of [key, value] pairs; value is a dict
#                  (sent as JSON). no_wait: false waits for broker acks.
#   kafka.consume  a LONG-RUNNING consumer. It never returns on its own: it
#                  relays every message into the workflow as an event on
#                  `relay_topic` with event_type `relay_event_type`, and runs
#                  until the workflow ends or cancels it. Always start it with
#                  async_mode: true (or in a parallel branch).
#
# Relayed event: event["data"] = {key, value, topic, partition, offset}.
#
# How this spec terminates: a state machine listens on the relay topic, counts
# the messages that carry THIS run's run_id (older leftovers are ignored), and
# finishes once it has seen all of them -- or after listen_timeout_sec via the
# state's sys.timer, so a dead or unreachable broker cannot hang the run (a
# failed publish fails the child; the parent then reports timed_out: true).
#
# The consumer group is fixed, so its committed offsets carry over between runs
# and each run reads only new messages. Offset reset is "earliest" for a new
# group, which the run_id filter makes harmless.
#
# NEEDS: a Kafka broker (default localhost:9092; the worker's MOCO_KAFKA_BROKER
# is used only when `broker` is empty). The topic is auto-created if the broker
# allows it.
#
#   moco run kafka.yaml
#   moco run kafka.yaml -i '{"broker": "kafka:9092", "message_count": 5}'

header:
  schema_version: 2.0.0
  workflow_name: act-kafka
  tags: [act-demo, kafka, requires-kafka]

context:
  received: {}  # key -> message; a dict so a redelivery is not double-counted
  timed_out: false
  publisher_wfspec#literal: |
    header:
      schema_version: 2.0.0
      workflow_name: act-kafka-publisher
    input:
      broker:
      topic:
      messages: []
    output: '{{ publish_result }}'
    main:
      tasks:
        - activity:
            type: builtin.delay
            input:
              duration: 1
        - task_name: publish
          activity:
            type: kafka.publish
            input:
              broker: '{{ broker }}'
              topic: '{{ topic }}'
              no_wait: false  # wait for broker acks
              messages: '{{ messages }}'
          output:
            as: publish_result
        # kafka.publish reports per-message failures as DATA
        # ([{result: fail, message: ...}]) instead of failing, so check.
        - raise:
            if: '{{ any(r.get("result") == "fail" for r in (publish_result or [])) }}'
            type: error
            error_type: AbortError
            message: 'kafka.publish failed: {{ publish_result }}'

input:
  broker: localhost:9092
  topic: act-demo-kafka
  consumer_group: act-demo-kafka-group
  message_count: 3
  # time for the consumer to join the group before we publish
  settle_sec: 5
  listen_timeout_sec: 60
output: '{{ report }}'

main:
  tasks:
    - task_name: ids
      set:
        - self_id: '{{ __sys_info__.get("workflow_id") or __sys_info__.get("trace_id") }}'
        - run_id#: '{{ self_id[-12:] }}'
        # [key, value] pairs. (Built here because the schema requires a
        # multi-line activity input expression to be a real array.)
        - outgoing: >-
            {{ [[run_id + "-" + str(i),
                 {"run_id": run_id, "seq": i, "text": "message " + str(i)}]
                for i in range(message_count)] }}
    - task_name: kafka-round-trip
      state_machine:
        initial_state: start
        event_source_topic: act_kafka_relay
        states:
          - name: start
            on_enter:
              tasks:
                - task_name: start-consumer
                  activity:
                    type: kafka.consume
                    input:
                      broker: '{{ broker }}'
                      topic: '{{ topic }}'
                      consumer_group: '{{ consumer_group }}'
                      relay_topic: act_kafka_relay  # == event_source_topic
                      relay_event_type: kafka_message
                      target_workflow_id: '{{ self_id }}'
                    options:
                      async_mode: true

                # execute_locally: false -- builtin.delay is a LOCAL activity by
                # default and would run before the async activity above is even
                # scheduled; a regular activity really waits after it starts.
                - task_name: let-consumer-join
                  activity:
                    type: builtin.delay
                    input:
                      duration: '{{ settle_sec }}'
                    options:
                      execute_locally: false

          # The publisher is an ASYNC child workflow that waits a moment before
          # publishing. Events are only handled while the machine is idle in a
          # state; anything relayed while an on_enter is still running can be
          # lost, so on_enter here just kicks the publisher off and returns.
          - name: listen
            timeout_sec: '{{ listen_timeout_sec }}'
            on_enter:
              task_name: start-publisher
              workflow:
                contents_yaml: '{{ publisher_wfspec }}'
                mode: async
                input:
                  broker: '{{ broker }}'
                  topic: '{{ topic }}'
                  messages: '{{ outgoing }}'

          - name: done
            is_terminal: true

        transitions:
          - from_state: start
            to_state: listen
            trigger: {}

          # one of ours, more to come: record it and stay
          - from_state: listen
            trigger:
              event_type: kafka_message
              condition: >-
                {{ event["data"]["value"].get("run_id") == run_id
                   and len(set(received) | {event["data"]["key"]}) < message_count }}
              action:
                set:
                  - _t: '{{ received.update({event["data"]["key"]: event["data"]}) }}'
                  - got#: 'key={{ event["data"]["key"] }} offset={{ event["data"]["offset"] }}'

          # the last one: record it and finish
          - from_state: listen
            to_state: done
            trigger:
              event_type: kafka_message
              condition: >-
                {{ event["data"]["value"].get("run_id") == run_id
                   and len(set(received) | {event["data"]["key"]}) >= message_count }}
              action:
                set:
                  - _t: '{{ received.update({event["data"]["key"]: event["data"]}) }}'

          # give up rather than hang
          - from_state: listen
            to_state: done
            trigger:
              event_type: sys.timer
              action:
                set:
                  - timed_out#: true

    - task_name: build-report
      set:
        - report:
            run_id: '{{ run_id }}'
            published: '{{ message_count }}'
            received_count#: '{{ len(received) }}'
            received_values: '{{ [received[k]["value"] for k in sorted(received)] }}'
            timed_out: '{{ timed_out }}'
