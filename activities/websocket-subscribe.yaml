# `websocket.subscribe`: stream WebSocket frames into a workflow.
#
#   url             ws:// or wss:// endpoint
#   init_messages   frames sent right after connecting (subscribe / auth
#                   messages); dicts are sent as JSON
#   headers, subprotocols   for the upgrade request
#   parse_json      true (default) -> each frame is JSON-decoded when possible
#
# Each inbound frame is relayed into the workflow as an event on relay_topic /
# relay_event_type, with event["data"] = the (parsed) frame. The activity runs
# until the server closes the connection or the workflow ends, so start it
# with async_mode: true and consume the events in a state machine (or wait_for).
#
# SELF-CONTAINED BY DEFAULT: with use_local_server: true (the default) the spec
# first launches a tiny WebSocket server with shell.run (Python + the
# `websockets` package that moco-core already depends on). The server reads the
# client's init message, sends message_count frames tagged with its run_id,
# then closes. The server and the subscriber must run on the same host, which
# holds for a single local worker or --in-memory. To use a real feed instead:
#
#   moco run websocket-subscribe.yaml -i '{"use_local_server": false,
#     "url": "wss://example.com/feed", "init_messages": [{"op": "subscribe"}]}'
#
# With a real feed the machine stops at listen_timeout_sec (or when the server
# closes the connection, which you can detect the same way).
#
# NEEDS: python on the worker PATH with `websockets` (default mode), or network
# access to `url`. The websocket client does not use MOCO_HTTP_PROXY.
#
#   moco run websocket-subscribe.yaml

header:
  schema_version: 2.0.0
  workflow_name: act-websocket-subscribe
  tags: [act-demo, websocket]

context:
  received: {}
  timed_out: false
  # Serves ONE client and exits (or gives up after 60s).
  server_script#literal: |
    python - <<'PY'
    import asyncio, json, os
    from websockets.asyncio.server import serve
    port, count = int(os.environ["WS_PORT"]), int(os.environ["WS_COUNT"])
    done = asyncio.Event()
    async def handler(ws):
        hello = json.loads(await ws.recv())      # the client's init_messages[0]
        await asyncio.sleep(1)
        for i in range(count):
            await ws.send(json.dumps({"run_id": hello.get("run_id"), "seq": i,
                                      "last": i == count - 1}))
        await ws.close()
        done.set()
    async def main():
        async with serve(handler, "127.0.0.1", port):
            print(f"serving on {port}", flush=True)
            await asyncio.wait_for(done.wait(), timeout=60)
    asyncio.run(main())
    PY
  # Polls until the server's port accepts connections (fails after ~30s).
  wait_script#literal: |
    python - <<'PY'
    import os, socket, sys, time
    port = int(os.environ["PORT"])
    for _ in range(60):
        try:
            socket.create_connection(("127.0.0.1", port), 1).close()
            sys.exit(0)
        except OSError:
            time.sleep(0.5)
    sys.exit(f"port {port} never opened")
    PY

input:
  use_local_server: true
  port: 18765
  url:  # default: ws://127.0.0.1:<port>
  init_messages: # default: [{"run_id": <this run>}]
  message_count: 3
  listen_timeout_sec: 30
output: '{{ report }}'

main:
  tasks:
    - task_name: ids
      set:
        - self_id: '{{ __sys_info__.get("workflow_id") or __sys_info__.get("trace_id") }}'
        - run_id#: '{{ self_id[-12:] }}'
        - ws_url#: '{{ url or "ws://127.0.0.1:" + str(port) }}'
        - ws_init: '{{ init_messages if init_messages is not None else [{"run_id": run_id}] }}'

    - task_name: websocket-stream
      state_machine:
        initial_state: start
        event_source_topic: act_ws_relay
        states:
          - name: start
            on_enter:
              skip_if: '{{ not use_local_server }}'
              tasks:
                - task_name: start-local-server
                  activity:
                    type: shell.run
                    input:
                      # Variables are PREFIXED rather than passed via `env`:
                      # shell.run's env replaces the whole environment,
                      # PATH included, and python would not be found.
                      command: '{{ "WS_PORT=" + str(int(port)) + " WS_COUNT=" + str(int(message_count)) + " " + server_script }}'
                      timeout: 90
                    options:
                      async_mode: true
                # A regular activity (not local like builtin.delay), so the async
                # server activity above is scheduled before this runs.
                - task_name: wait-for-server
                  activity:
                    type: shell.run
                    input:
                      command: '{{ "PORT=" + str(int(port)) + " " + wait_script }}'
                      check: true
                      timeout: 40

          # on_enter only STARTS the subscriber and returns, so the machine is
          # idle (and handling events) by the time frames arrive.
          - name: listen
            timeout_sec: '{{ listen_timeout_sec }}'
            on_enter:
              task_name: subscribe
              activity:
                type: websocket.subscribe
                input:
                  url: '{{ ws_url }}'
                  init_messages: '{{ ws_init }}'
                  parse_json: true
                  relay_topic: act_ws_relay  # == event_source_topic
                  relay_event_type: ws_frame
                  target_workflow_id: '{{ self_id }}'
                options:
                  async_mode: true

          - name: done
            is_terminal: true

        transitions:
          - from_state: start
            to_state: listen
            trigger: {}

          - from_state: listen
            trigger:
              event_type: ws_frame
              condition: '{{ not (isinstance(event["data"], dict) and event["data"].get("last")) }}'
              action:
                set:
                  - _t: '{{ received.update({(event["data"].get("seq", len(received)) if isinstance(event["data"], dict) else len(received)): event["data"]}) }}'
                  - frame#: '{{ event["data"] }}'

          - from_state: listen
            to_state: done
            trigger:
              event_type: ws_frame
              condition: '{{ isinstance(event["data"], dict) and event["data"].get("last") }}'
              action:
                set:
                  - _t: '{{ received.update({(event["data"].get("seq", len(received)) if isinstance(event["data"], dict) else len(received)): event["data"]}) }}'

          - from_state: listen
            to_state: done
            trigger:
              event_type: sys.timer
              action:
                set:
                  - timed_out#: true

    - task_name: build-report
      set:
        - report:
            url: '{{ ws_url }}'
            received_count#: '{{ len(received) }}'
            frames: '{{ [received[k] for k in sorted(received)] }}'
            timed_out: '{{ timed_out }}'
