# The `builtin.secret.*` activities.
#
#   builtin.secret.list    names of the secrets in your namespace (never values)
#   builtin.secret.get     a secret, re-encrypted with a short-lived key. The
#                          plaintext never enters workflow variables; pass the
#                          blob (or better, just the secret NAME) to activities
#                          that accept an encrypted token / *_secret_key.
#   builtin.secret.upload  store a secret. The payload must already be encrypted
#                          client-side with the server's RSA public key, so a
#                          workflow cannot mint one from plaintext. `moco secret
#                          upload NAME VALUE` does the encryption for you, and is
#                          the normal way to create secrets.
#   builtin.secret.delete  remove a secret
#
# By default this spec is read-only: it lists your secrets and fetches one that
# already exists (read_secret_name). The upload -> delete round trip runs only
# when you pass an already-encrypted payload in `encrypted_secret`; it writes
# to the clearly-named scratch secret ACT_DEMO_SCRATCH_SECRET and removes it.
#
# NEEDS: at least one secret in your namespace (read_secret_name, default
# MY_LLM_TOKEN; `moco secret list` shows yours). Runs on both runtimes.
#
#   moco run builtin-secret.yaml
#   moco run builtin-secret.yaml -i '{"read_secret_name": "MY_OPENAI_APIKEY"}'

header:
  schema_version: 2.0.0
  workflow_name: act-builtin-secret
  tags: [act-demo, builtin, requires-secret]

input:
  read_secret_name: MY_LLM_TOKEN
  # {"encrypted_data": "...", "encrypt_key_name": "MOCO_RSA_..."} -- RSA-encrypted
  encrypted_secret:
  scratch_secret_name: ACT_DEMO_SCRATCH_SECRET

output: '{{ report }}'

main:
  tasks:
    - task_name: list-secrets
      activity:
        type: builtin.secret.list
        input: {}
      output:
        as: secret_names

    - task_name: require-read-secret
      raise:
        if: '{{ read_secret_name not in secret_names }}'
        type: terminate
        message: >-
          Secret '{{ read_secret_name }}' not found. Existing secrets: {{ secret_names }}. Pass -i '{"read_secret_name": "<one of those>"}'.
    # Returns {encrypted_data, encrypt_key_name}, valid for expiration_seconds.
    - task_name: get-secret
      activity:
        type: builtin.secret.get
        input:
          secret_name: '{{ read_secret_name }}'
          expiration_seconds: 60
      output:
        as: encrypted_blob

    # --- optional upload -> delete round trip on a scratch secret -----------
    - task_name: scratch-round-trip
      skip_if: '{{ encrypted_secret is None }}'
      tasks:
        - task_name: upload-scratch
          activity:
            type: builtin.secret.upload
            input:
              secret_name: '{{ scratch_secret_name }}'
              encrypted_secret: '{{ encrypted_secret }}'
        - task_name: list-after-upload
          activity:
            type: builtin.secret.list
            input: {}
          output:
            as: names_after_upload
        - task_name: delete-scratch
          activity:
            type: builtin.secret.delete
            input:
              secret_name: '{{ scratch_secret_name }}'
        - set:
            - scratch_was_listed#: '{{ scratch_secret_name in names_after_upload }}'

    - task_name: build-report
      set:
        - report:
            secret_names#: '{{ secret_names }}'
            read_secret_name: '{{ read_secret_name }}'
            # show the shape only -- never log secret material, even encrypted
            get_returned_keys#: '{{ sorted(encrypted_blob.keys()) if isinstance(encrypted_blob, dict) else str(type(encrypted_blob)) }}'
            round_trip_ran: '{{ encrypted_secret is not None }}'
