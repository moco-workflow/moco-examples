# The smallest useful workflow: a `header`, one task in `main`, and an `output`.
#
# Every node under `main` is a task. A task carries exactly one kind key (here
# `activity`) plus optional shared keys: task_name, skip_if, props, output, on_error.
#
# An activity task names the activity `type`, and gives it an `input` (evaluated on
# every run, so it may use `{{ }}`) and optional `options` (retry, cache, async).
#
# A task's `output` post-processes what its kind returned:
#   _      the kind's raw result. http.request returns
#          {status_code, is_success, headers, json | text}; httpbin.org/post echoes
#          the request back, so the body we sent is `_["json"]["json"]`.
#   data   the task's result (defaults to `_`)
#   as     the variable that stores the result
#
# NEEDS: outbound HTTPS to httpbin.org. Behind a TLS-inspecting proxy:
#   moco run 01-single-activity.yaml -i '{"skip_cert_verify": true}'

header:
  schema_version: 2.0.0
  workflow_name: basics-single-activity
  tags: [build-my-workflow, basics, level-1-basics]

input:
  base_url: https://httpbin.org
  proxy:                    # empty: the worker's MOCO_HTTP_PROXY, if any
  skip_cert_verify: false

# The workflow's result: an expression (as here) or a mapping, evaluated after `main`.
output: '{{ order }}'

main:
  task_name: post-order
  activity:
    type: http.request
    input:
      method: POST
      url: '{{ base_url }}/post'
      json_data:
        order_id: ORD-1
        items: [{sku: A, qty: 2}]
      output_json: true           # parse the response body into `json`
      raise_for_status: true      # a 4xx/5xx fails the task
      proxy: '{{ proxy }}'
      skip_cert_verify: '{{ skip_cert_verify }}'
    options:
      retry_policy:
        max_attempts: 3
        timeout_sec: 60
  output:
    data: '{{ _["json"]["json"] }}'
    as: order
