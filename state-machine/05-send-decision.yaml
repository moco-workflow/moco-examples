# The human's side of 04-human-in-the-loop: deliver one decision to a waiting workflow.
#
# `emit_event` with `target_workflow_id` sends an event to another running workflow. The
# topic must match the target state machine's `event_source_topic`, and `event_type` must
# match one of its transition triggers -- anything else is silently ignored.
#
#   moco start 04-human-in-the-loop.yaml -i '{"simulate_approver": false}'
#   moco run 05-send-decision.yaml -i '{"workflow_id": "<id>", "event_type": "add_comment", "comment": "receipt?"}'
#   moco run 05-send-decision.yaml -i '{"workflow_id": "<id>", "event_type": "approve"}'
#
# In a real system this is the step a UI button, a Slack action or an email link performs.
#
# Run with no workflow_id and it just explains itself instead of failing.

header:
  schema_version: 2.0.0
  workflow_name: sm-send-decision
  tags: [build-my-workflow, state-machine, human-in-the-loop]

input:
  workflow_id:  # the id printed by `moco start`
  event_type: approve # approve | reject | add_comment
  comment: ''
  approver: ''  # defaults to the calling user (input defaults are not evaluated)

output: '{{ sent }}'

main:
  tasks:
    - task_name: resolve-approver
      set:
        - approver: '{{ approver or __user_info__.get("user_id") }}'

    - task_name: deliver-decision
      skip_if: '{{ not workflow_id }}'
      emit_event:
        topic: approvals
        event_type: '{{ event_type }}'
        target_workflow_id: '{{ workflow_id }}'
        data:
          approver: '{{ approver }}'
          comment: '{{ comment }}'

    - task_name: report
      set:
        - sent#: >-
            {{ f"sent '{event_type}' from {approver} to {workflow_id}" if workflow_id
               else "nothing sent: pass -i '{\"workflow_id\": \"<id>\", \"event_type\": \"approve\"}'" }}
